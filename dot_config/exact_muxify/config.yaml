# Managed by chezmoi: edit ~/.local/share/chezmoi/dot_config/exact_muxify/config.yaml

# Project discovery, the same roots as pop's `projects`
sessions:
  paths:
    - path: ~/work
      depth: 1
    - path: ~/personal
      depth: 1
    - path: ~/projects
      depth: 1
    - path: ~/.local/share/chezmoi

# Interface text at Ghostty's font-size (dot_config/exact_ghostty/config.tmpl)
ui:
  font_size: 14

# 5 In Play places: the Topics you're working on. Other open Topics wait on
# the Bench; Pinned Topics and Guests don't count toward the 5
topics:
  in_play: 5

command_palettes:
  - name: Go to…
    keybinding: cmd+p
    sources: [topics, sessions]
  - name: Commands
    keybinding: cmd+shift+p
    sources: [commands]
  - name: Agents
    keybinding: cmd+shift+o
    sources: [agents]

keybindings:
  select_prev_topic: cmd+left_bracket
  select_next_topic: cmd+right_bracket
  select_prev_session: cmd+shift+left_bracket
  select_next_session: cmd+shift+right_bracket
  # cmd+brackets above take these from their defaults (Browser Focus only)
  browser_back: cmd+alt+left
  browser_forward: cmd+alt+right
  # cmd+shift+brackets above take these from select_prev/next_tab, which
  # keep ctrl+shift+tab / ctrl+tab

# Logs freezes, CPU and errors to ~/Library/Logs/Muxify
diagnostics:
  enabled: true
